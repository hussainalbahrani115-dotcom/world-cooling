<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة آفاق التبريد التجارية - World Cooling Trading</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f14; color: #e6edf3; padding: 16px; transition: 0.3s; }
        body.ltr { direction: ltr; text-align: left; }
        .container { max-width: 1100px; margin: auto; }
        .brand-header {
            text-align: center;
            padding: 25px 0 18px;
            border-bottom: 3px solid #1f6feb;
            margin-bottom: 22px;
            background: linear-gradient(145deg, #0d1a2b, #0b0f14);
            border-radius: 20px;
            box-shadow: 0 0 30px #1f6feb22;
        }
        .brand-ar { font-size: 36px; font-weight: 800; color: #ffffff; letter-spacing: 2px; text-shadow: 0 0 20px #1f6feb99; }
        .brand-en { font-size: 22px; font-weight: 300; color: #8ab4f8; letter-spacing: 4px; margin-top: 6px; text-transform: uppercase; }
        .brand-sub { font-size: 14px; color: #8b949e; margin-top: 10px; border-top: 1px solid #1f6feb44; padding-top: 10px; display: inline-block; padding-left: 20px; padding-right: 20px; }
        body.ltr .brand-ar { font-size: 30px; }
        body.ltr .brand-en { font-size: 26px; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .tab-btn { background: #21262d; border: none; color: #8b949e; padding: 12px 28px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .tab-btn.active { background: #1f6feb; color: white; box-shadow: 0 0 20px #1f6feb66; }
        .tab-btn:hover { background: #30363d; color: white; }
        .page { display: none; animation: fade 0.3s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }
        .card { background: #161b22; border-radius: 16px; padding: 22px; margin-bottom: 20px; border: 1px solid #30363d; }
        .card h2 { margin-top: 0; border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; font-size: 22px; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
        .flex-row input, .flex-row select { padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; flex: 1 1 160px; min-width: 140px; }
        .flex-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #1f6feb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .flex-row button:hover { background: #388bfd; }
        .flex-row button.danger { background: #da3633; }
        .flex-row button.danger:hover { background: #f85149; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; border-bottom: 1px solid #30363d; text-align: right; }
        body.ltr th, body.ltr td { text-align: left; }
        .total-box { font-size: 26px; font-weight: bold; color: #f0883e; margin-top: 12px; padding: 12px; background: #0d1117; border-radius: 12px; border: 1px solid #30363d; }
        .lang-toggle { position: fixed; top: 16px; left: 16px; background: #21262d; border: 1px solid #30363d; padding: 8px 18px; border-radius: 30px; cursor: pointer; z-index: 999; color: #e6edf3; }
        .lang-toggle:hover { background: #30363d; }
        .btn-sm { padding: 4px 12px; font-size: 13px; margin: 2px; }
        .empty-msg { color: #8b949e; font-style: italic; padding: 20px; text-align: center; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .sync-status { position: fixed; bottom: 20px; right: 20px; background: #1f6feb; color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; box-shadow: 0 0 20px #1f6feb55; z-index: 999; }
        .sync-status.saved { background: #238636; }
        .sync-status.error { background: #da3633; }
    </style>
</head>
<body>

    <div class="lang-toggle" id="langToggle">🇸🇦 العربية / English</div>
    <div class="sync-status" id="syncStatus">🔄 جارٍ المزامنة...</div>

    <div class="container">

        <!-- الهوية -->
        <div class="brand-header">
            <div class="brand-ar">مؤسسة آفاق التبريد التجارية</div>
            <div class="brand-en">World Cooling Trade</div>
            <div class="brand-sub" id="brandSub">⏣ نظام إدارة الموردين والفواتير - سحابي</div>
        </div>

        <!-- شريط التنقل -->
        <div class="tabs" id="tabBar">
            <button class="tab-btn active" data-page="page1" id="tab1">🗂️ الموردين</button>
            <button class="tab-btn" data-page="page2" id="tab2">🏦 الأرصدة</button>
            <button class="tab-btn" data-page="page3" id="tab3">📄 الفواتير</button>
        </div>

        <!-- الصفحات (نفسها) -->
        <div class="page active" id="page1">
            <div class="card">
                <h2 id="titleSuppliers">🗂️ إدارة الموردين</h2>
                <div class="flex-row">
                    <input type="text" id="supplierName" placeholder="اسم المورد" />
                    <input type="text" id="supplierBank" placeholder="اسم البنك" />
                    <input type="text" id="supplierIban" placeholder="رقم IBAN" />
                    <button id="addSupplierBtn">➕ إضافة</button>
                </div>
                <table>
                    <thead><tr><th>#</th><th id="thName">اسم المورد</th><th id="thBank">البنك</th><th id="thIban">IBAN</th><th id="thAction">إجراء</th></tr></thead>
                    <tbody id="supplierBody"></tbody>
                </table>
            </div>
        </div>

        <div class="page" id="page2">
            <div class="card">
                <h2 id="titleBalances">🏦 الأرصدة البنكية</h2>
                <div class="flex-row">
                    <label id="lblAhli">🇸🇦 الأهلي: <input type="number" id="balAhli" step="0.01" /></label>
                    <label id="lblFaransi">🇫🇷 الفرنسي: <input type="number" id="balFaransi" step="0.01" /></label>
                    <label id="lblInma">🇸🇦 الإنماء: <input type="number" id="balInma" step="0.01" /></label>
                </div>
                <div class="total-box" id="totalBalance">المجموع: 0.00 ريال</div>
            </div>
        </div>

        <div class="page" id="page3">
            <div class="card">
                <h2 id="titleInvoices">📄 الفواتير المستحقة للسداد</h2>
                <div class="flex-row">
                    <input type="text" id="invoiceCompany" placeholder="اسم الشركة" />
                    <input type="number" id="invoiceAmount" placeholder="المبلغ" step="0.01" />
                    <button id="addInvoiceBtn">➕ إضافة فاتورة</button>
                </div>
                <table>
                    <thead><tr><th>#</th><th id="thCompany">الشركة</th><th id="thAmount">المبلغ</th><th id="thAction2">إجراء</th></tr></thead>
                    <tbody id="invoiceBody"></tbody>
                </table>
                <div class="total-box" id="totalInvoices">إجمالي المدفوعات: 0.00 ريال</div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  1. إعداد Firebase (استبدل هذه القيم بقيم مشروعك)
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        //  2. البيانات المحلية
        // ============================================================
        let data = {
            suppliers: [],
            balances: { ahli: 0, faransi: 0, inma: 0 },
            invoices: []
        };

        let isSaving = false;
        let lastSavedData = '';

        // ============================================================
        //  3. الترجمة (نفسها)
        // ============================================================
        const LANG = {
            ar: {
                brandSub: '⏣ نظام إدارة الموردين والفواتير - سحابي',
                tab1: '🗂️ الموردين', tab2: '🏦 الأرصدة', tab3: '📄 الفواتير',
                titleSuppliers: '🗂️ إدارة الموردين', titleBalances: '🏦 الأرصدة البنكية', titleInvoices: '📄 الفواتير المستحقة للسداد',
                thName: 'اسم المورد', thBank: 'البنك', thIban: 'IBAN', thAction: 'إجراء',
                thCompany: 'الشركة', thAmount: 'المبلغ', thAction2: 'إجراء',
                lblAhli: '🇸🇦 الأهلي:', lblFaransi: '🇫🇷 الفرنسي:', lblInma: '🇸🇦 الإنماء:',
                totalBalance: 'المجموع:', totalInvoices: 'إجمالي المدفوعات:',
                emptySuppliers: 'لا يوجد موردون', emptyInvoices: 'لا توجد فواتير',
                addSupplier: '➕ إضافة', addInvoice: '➕ إضافة فاتورة',
                delete: '🗑️ حذف', save: '💾 حفظ',
                alertFillFields: 'الرجاء ملء جميع الحقول', alertValidAmount: 'أدخل مبلغاً صحيحاً',
                confirmDelete: 'هل أنت متأكد من الحذف؟',
                placeholderSupplierName: 'اسم المورد', placeholderSupplierBank: 'اسم البنك', placeholderSupplierIban: 'رقم IBAN',
                placeholderInvoiceCompany: 'اسم الشركة', placeholderInvoiceAmount: 'المبلغ'
            },
            en: {
                brandSub: '⏣ Supplier & Invoice Management - Cloud',
                tab1: '🗂️ Suppliers', tab2: '🏦 Balances', tab3: '📄 Invoices',
                titleSuppliers: '🗂️ Supplier Management', titleBalances: '🏦 Bank Balances', titleInvoices: '📄 Pending Invoices',
                thName: 'Supplier Name', thBank: 'Bank', thIban: 'IBAN', thAction: 'Action',
                thCompany: 'Company', thAmount: 'Amount', thAction2: 'Action',
                lblAhli: '🇸🇦 AlAhli:', lblFaransi: '🇫🇷 French Bank:', lblInma: '🇸🇦 AlInma:',
                totalBalance: 'Total:', totalInvoices: 'Total Payments:',
                emptySuppliers: 'No suppliers', emptyInvoices: 'No invoices',
                addSupplier: '➕ Add', addInvoice: '➕ Add Invoice',
                delete: '🗑️ Delete', save: '💾 Save',
                alertFillFields: 'Fill all fields', alertValidAmount: 'Enter valid amount',
                confirmDelete: 'Are you sure?',
                placeholderSupplierName: 'Supplier Name', placeholderSupplierBank: 'Bank Name', placeholderSupplierIban: 'IBAN',
                placeholderInvoiceCompany: 'Company', placeholderInvoiceAmount: 'Amount'
            }
        };
        let currentLang = 'ar';

        // ============================================================
        //  4. المزامنة مع Firebase
        // ============================================================
        function setSyncStatus(text, type = 'loading') {
            const el = document.getElementById('syncStatus');
            el.innerText = text;
            el.className = 'sync-status';
            if (type === 'saved') el.classList.add('saved');
            if (type === 'error') el.classList.add('error');
        }

        // تحميل البيانات من السحابة
        async function loadFromCloud() {
            try {
                setSyncStatus('🔄 جارٍ التحميل...', 'loading');
                const doc = await db.collection('appData').doc('mainData').get();
                if (doc.exists) {
                    const cloudData = doc.data();
                    if (cloudData && cloudData.suppliers) {
                        data = cloudData;
                        if (!data.balances) data.balances = { ahli: 0, faransi: 0, inma: 0 };
                        if (!data.invoices) data.invoices = [];
                        refreshAll();
                        setSyncStatus('✅ تم التحميل من السحابة', 'saved');
                        console.log('✅ تم تحميل البيانات من Firebase');
                        return;
                    }
                }
                // إذا لم توجد بيانات في السحابة، استخدم البيانات المحلية أو الفارغة
                setSyncStatus('📡 لا توجد بيانات سحابية، نبدأ من جديد', 'saved');
                refreshAll();
            } catch (error) {
                console.error('❌ خطأ في التحميل:', error);
                setSyncStatus('❌ خطأ في الاتصال بالسحابة', 'error');
                // نستخدم البيانات المحلية إن وجدت
                refreshAll();
            }
        }

        // حفظ البيانات إلى السحابة
        async function saveToCloud() {
            const currentDataStr = JSON.stringify(data);
            if (currentDataStr === lastSavedData && lastSavedData !== '') {
                // لا تغيير
                return;
            }
            if (isSaving) return;
            isSaving = true;
            try {
                setSyncStatus('⏳ جارٍ الحفظ...', 'loading');
                await db.collection('appData').doc('mainData').set(data);
                lastSavedData = currentDataStr;
                setSyncStatus('✅ تم الحفظ في السحابة', 'saved');
                console.log('✅ تم حفظ البيانات في Firebase');
            } catch (error) {
                console.error('❌ خطأ في الحفظ:', error);
                setSyncStatus('❌ فشل الحفظ - تحقق من الإنترنت', 'error');
            } finally {
                isSaving = false;
            }
        }

        // ============================================================
        //  5. دوال العرض والتعديل (نفسها مع إضافة حفظ تلقائي)
        // ============================================================
        function renderSuppliers() {
            const tbody = document.getElementById('supplierBody');
            if (data.suppliers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-msg">${LANG[currentLang].emptySuppliers}</td></tr>`;
                return;
            }
            tbody.innerHTML = data.suppliers.map((s, idx) => `
                <tr>
                    <td>${idx+1}</td>
                    <td><input type="text" value="${s.name}" data-id="${s.id}" class="edit-supplier-name" style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px;" /></td>
                    <td><input type="text" value="${s.bank || ''}" data-id="${s.id}" class="edit-supplier-bank" style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px;" /></td>
                    <td><input type="text" value="${s.iban}" data-id="${s.id}" class="edit-supplier-iban" style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px;" /></td>
                    <td class="actions">
                        <button class="danger btn-sm" onclick="deleteSupplier('${s.id}')">${LANG[currentLang].delete}</button>
                        <button class="btn-sm" onclick="updateSupplier('${s.id}')">${LANG[currentLang].save}</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderInvoices() {
            const tbody = document.getElementById('invoiceBody');
            if (data.invoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">${LANG[currentLang].emptyInvoices}</td></tr>`;
                document.getElementById('totalInvoices').innerText = `${LANG[currentLang].totalInvoices} 0.00 ريال`;
                return;
            }
            let total = 0;
            tbody.innerHTML = data.invoices.map((inv, idx) => {
                total += inv.amount;
                return `
                    <tr>
                        <td>${idx+1}</td>
                        <td><input type="text" value="${inv.company}" data-id="${inv.id}" class="edit-inv-company" style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px;" /></td>
                        <td><input type="number" value="${inv.amount}" data-id="${inv.id}" class="edit-inv-amount" step="0.01" style="width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:4px;" /></td>
                        <td class="actions">
                            <button class="danger btn-sm" onclick="deleteInvoice('${inv.id}')">${LANG[currentLang].delete}</button>
                            <button class="btn-sm" onclick="updateInvoice('${inv.id}')">${LANG[currentLang].save}</button>
                        </td>
                    </tr>
                `;
            }).join('');
            document.getElementById('totalInvoices').innerText = `${LANG[currentLang].totalInvoices} ${total.toFixed(2)} ريال`;
        }

        function renderBalances() {
            document.getElementById('balAhli').value = data.balances.ahli || 0;
            document.getElementById('balFaransi').value = data.balances.faransi || 0;
            document.getElementById('balInma').value = data.balances.inma || 0;
            const sum = (data.balances.ahli || 0) + (data.balances.faransi || 0) + (data.balances.inma || 0);
            document.getElementById('totalBalance').innerText = `${LANG[currentLang].totalBalance} ${sum.toFixed(2)} ريال`;
        }

        function refreshAll() {
            renderSuppliers();
            renderInvoices();
            renderBalances();
            // حفظ تلقائي بعد كل تغيير
            saveToCloud();
        }

        // ============================================================
        //  6. العمليات (نفسها مع استدعاء refreshAll)
        // ============================================================
        function addSupplier() {
            const name = document.getElementById('supplierName').value.trim();
            const bank = document.getElementById('supplierBank').value.trim();
            const iban = document.getElementById('supplierIban').value.trim();
            if (!name || !iban) { alert(LANG[currentLang].alertFillFields); return; }
            data.suppliers.push({ id: crypto.randomUUID(), name, bank, iban });
            document.getElementById('supplierName').value = '';
            document.getElementById('supplierBank').value = '';
            document.getElementById('supplierIban').value = '';
            refreshAll();
        }

        function deleteSupplier(id) {
            if (!confirm(LANG[currentLang].confirmDelete)) return;
            data.suppliers = data.suppliers.filter(s => s.id !== id);
            refreshAll();
        }

        function updateSupplier(id) {
            const nameInput = document.querySelector(`.edit-supplier-name[data-id="${id}"]`);
            const bankInput = document.querySelector(`.edit-supplier-bank[data-id="${id}"]`);
            const ibanInput = document.querySelector(`.edit-supplier-iban[data-id="${id}"]`);
            if (!nameInput || !ibanInput) return;
            const supplier = data.suppliers.find(s => s.id === id);
            if (supplier) {
                supplier.name = nameInput.value.trim() || supplier.name;
                supplier.bank = bankInput.value.trim() || supplier.bank;
                supplier.iban = ibanInput.value.trim() || supplier.iban;
                refreshAll();
            }
        }

        function addInvoice() {
            const company = document.getElementById('invoiceCompany').value.trim();
            const amount = parseFloat(document.getElementById('invoiceAmount').value);
            if (!company || isNaN(amount) || amount <= 0) { alert(LANG[currentLang].alertValidAmount); return; }
            data.invoices.push({ id: crypto.randomUUID(), company, amount });
            document.getElementById('invoiceCompany').value = '';
            document.getElementById('invoiceAmount').value = '';
            refreshAll();
        }

        function deleteInvoice(id) {
            if (!confirm(LANG[currentLang].confirmDelete)) return;
            data.invoices = data.invoices.filter(inv => inv.id !== id);
            refreshAll();
        }

        function updateInvoice(id) {
            const compInput = document.querySelector(`.edit-inv-company[data-id="${id}"]`);
            const amtInput = document.querySelector(`.edit-inv-amount[data-id="${id}"]`);
            if (!compInput || !amtInput) return;
            const invoice = data.invoices.find(inv => inv.id === id);
            if (invoice) {
                invoice.company = compInput.value.trim() || invoice.company;
                invoice.amount = parseFloat(amtInput.value) || invoice.amount;
                refreshAll();
            }
        }

        // الأرصدة
        document.getElementById('balAhli').addEventListener('input', function() {
            data.balances.ahli = parseFloat(this.value) || 0;
            refreshAll();
        });
        document.getElementById('balFaransi').addEventListener('input', function() {
            data.balances.faransi = parseFloat(this.value) || 0;
            refreshAll();
        });
        document.getElementById('balInma').addEventListener('input', function() {
            data.balances.inma = parseFloat(this.value) || 0;
            refreshAll();
        });

        // ============================================================
        //  7. تبديل اللغة
        // ============================================================
        function applyLanguage(lang) {
            currentLang = lang;
            const t = LANG[lang];
            document.getElementById('brandSub').innerText = t.brandSub;
            document.getElementById('tab1').innerText = t.tab1;
            document.getElementById('tab2').innerText = t.tab2;
            document.getElementById('tab3').innerText = t.tab3;
            document.getElementById('titleSuppliers').innerText = t.titleSuppliers;
            document.getElementById('titleBalances').innerText = t.titleBalances;
            document.getElementById('titleInvoices').innerText = t.titleInvoices;
            document.getElementById('thName').innerText = t.thName;
            document.getElementById('thBank').innerText = t.thBank;
            document.getElementById('thIban').innerText = t.thIban;
            document.getElementById('thAction').innerText = t.thAction;
            document.getElementById('thCompany').innerText = t.thCompany;
            document.getElementById('thAmount').innerText = t.thAmount;
            document.getElementById('thAction2').innerText = t.thAction2;
            document.getElementById('lblAhli').innerHTML = `${t.lblAhli} <input type="number" id="balAhli" step="0.01" />`;
            document.getElementById('lblFaransi').innerHTML = `${t.lblFaransi} <input type="number" id="balFaransi" step="0.01" />`;
            document.getElementById('lblInma').innerHTML = `${t.lblInma} <input type="number" id="balInma" step="0.01" />`;
            document.getElementById('addSupplierBtn').innerHTML = t.addSupplier;
            document.getElementById('addInvoiceBtn').innerHTML = t.addInvoice;
            document.getElementById('supplierName').placeholder = t.placeholderSupplierName;
            document.getElementById('supplierBank').placeholder = t.placeholderSupplierBank;
            document.getElementById('supplierIban').placeholder = t.placeholderSupplierIban;
            document.getElementById('invoiceCompany').placeholder = t.placeholderInvoiceCompany;
            document.getElementById('invoiceAmount').placeholder = t.placeholderInvoiceAmount;
            // إعادة ربط الأحداث
            document.getElementById('balAhli').addEventListener('input', function() {
                data.balances.ahli = parseFloat(this.value) || 0;
                refreshAll();
            });
            document.getElementById('balFaransi').addEventListener('input', function() {
                data.balances.faransi = parseFloat(this.value) || 0;
                refreshAll();
            });
            document.getElementById('balInma').addEventListener('input', function() {
                data.balances.inma = parseFloat(this.value) || 0;
                refreshAll();
            });
            refreshAll();
        }

        document.getElementById('langToggle').addEventListener('click', function() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            document.body.dir = newLang === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.toggle('ltr', newLang === 'en');
            this.innerText = newLang === 'ar' ? '🇸🇦 العربية / English' : 'English / العربية 🇸🇦';
            applyLanguage(newLang);
        });

        // ============================================================
        //  8. التنقل بين الصفحات
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(this.dataset.page).classList.add('active');
            });
        });

        // ============================================================
        //  9. ربط الأزرار
        // ============================================================
        document.getElementById('addSupplierBtn').addEventListener('click', addSupplier);
        document.getElementById('addInvoiceBtn').addEventListener('click', addInvoice);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (['supplierName','supplierBank','supplierIban'].includes(document.activeElement.id)) {
                    addSupplier();
                } else if (['invoiceCompany','invoiceAmount'].includes(document.activeElement.id)) {
                    addInvoice();
                }
            }
        });

        // ============================================================
        //  10. التهيئة - تحميل من السحابة أولاً
        // ============================================================
        // نحمّل البيانات من السحابة عند بدء التشغيل
        (async function init() {
            await loadFromCloud();
            applyLanguage('ar');
            // نستمع للتغييرات في السحابة (تحديث لحظي من الأجهزة الأخرى)
            db.collection('appData').doc('mainData').onSnapshot((doc) => {
                if (doc.exists) {
                    const cloudData = doc.data();
                    if (cloudData) {
                        // تجنب إعادة التحديث إذا كانت البيانات نفسها
                        const newStr = JSON.stringify(cloudData);
                        if (newStr !== JSON.stringify(data)) {
                            data = cloudData;
                            if (!data.balances) data.balances = { ahli: 0, faransi: 0, inma: 0 };
                            if (!data.invoices) data.invoices = [];
                            refreshAll();
                            setSyncStatus('🔄 تم التحديث من جهاز آخر', 'saved');
                            console.log('🔄 تحديث لحظي من السحابة');
                        }
                    }
                }
            });
        })();

        console.log('✅ مؤسسة آفاق التبريد التجارية - السحابة جاهزة 2026');
    </script>
</body>
</html>
